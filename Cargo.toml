[package]
name = "pit"
version = "0.12.2"
edition = "2024"
license = "MIT"
description = "PitFast developer CLI"

[[bin]]
name = "pit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pit-artifact = { path = "../pit-crew/crates/pit-artifact" }
pit-builder-rust = { path = "../pit-crew/crates/pit-builder-rust" }
pit-builder-go = { path = "../pit-crew/crates/pit-builder-go" }
pit-builder-native = { path = "../pit-crew/crates/pit-builder-native" }
pit-builder-js = { path = "../pit-crew/crates/pit-builder-js" }
pit-builder-python = { path = "../pit-crew/crates/pit-builder-python" }
pit-builder-experimental = { path = "../pit-crew/crates/pit-builder-experimental" }
pit-builder-core = { path = "../pit-crew/crates/pit-builder-core" }
pit-circuit-core = { path = "../pit-circuit/crates/pit-circuit-core" }
pit-crew = { path = "../pit-crew/crates/pit-crew" }
pit-node = { path = "../pit-box/apps/pit-node" }
pit-scheduler = { path = "../pit-box/crates/pit-scheduler" }
pit-lane-core = { path = "../pit-lane/crates/pit-lane-core" }
pit-deployment = { path = "../pit-lane/crates/pit-deployment" }
pit-paddock-core = { path = "../pit-paddock/crates/pit-paddock-core" }
pit-paddock-fs = { path = "../pit-paddock/crates/pit-paddock-fs" }
pit-paddock-factory = { path = "../pit-paddock/crates/pit-paddock-factory" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
