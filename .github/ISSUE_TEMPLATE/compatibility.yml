name: Compatibility request
description: Report an application/framework compatibility result
title: "compat: "
labels: [compatibility]
body:
  - type: input
    id: language
    attributes:
      label: Language and version
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework and version
    validations:
      required: true
  - type: input
    id: interface
    attributes:
      label: Application interface
      description: For example `asgi`, `fetch`, `net-http`, or `static-web`.
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Include reviewed `pit doctor --verbose` output.
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: Dependency or capability blocker
