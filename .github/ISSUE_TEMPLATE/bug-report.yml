name: Bug report
description: Report a reproducible PitFast problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include secrets, tokens, passwords, or private connection strings."
  - type: input
    id: version
    attributes:
      label: PitFast version
      description: Output of `pit --version`.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach reviewed output from `pit diagnostics`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal project and exact commands.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
